# The digest catalog. Each feed becomes one spoken segment, in `order`.
# A feed can aggregate several sources; their stories are merged, then curated.
# Add a new topic by adding a feed here — no code changes needed.

feeds:
  - name: "AI & Tech"
    order: 1
    enabled: true
    length_budget_words: 700          # Option A: comprehensive tech-radar — room to cover every launch
    max_stories: 10               # keep more of what the feeds surface (was 8)
    prompt: prompts/ai_news.md
    curate_prompt: prompts/curate_ai_news.md      # how the CURATOR ranks (vs prompt = how the rewrite writes)
    interests: ["AI", "agent", "LLM", "model", "open source", "tool", "launch",
                "release", "inference", "GPU", "benchmark", "Anthropic", "OpenAI",
                "Google", "Meta", "startup"]
    sources:
      # TLDR AI, straight from tldr.tech — the real current AI edition as HTML.
      # Sponsors are dropped at the source; stories carry real publisher URLs + categories.
      - type: tldr_web
        params: { max_items: 12 }
      - type: hackernews
        params: { queries: ["Show HN", "AI agent", "LLM"], min_points: 50, lookback_days: 2, max_items: 8 }
      # Publishers' own RSS (served from their CDNs) — reliable from Cloud Run, unlike Google News
      # which now returns HTTP 503 to datacenter IPs. See sources/rss.py.
      - type: rss
        params:
          feeds:
            - "https://feeds.arstechnica.com/arstechnica/technology-lab"
            - "https://www.theverge.com/rss/index.xml"
            - "https://techcrunch.com/feed/"
          max_items: 10
          max_per_feed: 5
          lookback_days: 2
      # - type: producthunt   # optional; needs PRODUCTHUNT_TOKEN. Enable later.
      #   params: { topic: "artificial-intelligence" }

  - name: "US Headlines"
    order: 2
    enabled: true
    length_budget_words: 250
    max_stories: 6
    prompt: prompts/us_news.md
    curate_prompt: prompts/curate_us_news.md
    interests: ["policy", "economy", "election", "court", "congress", "national"]
    sources:
      # Major outlets' own top-stories RSS — reliable from datacenters (Google News 503s there).
      - type: rss
        params:
          feeds:
            - "https://feeds.npr.org/1001/rss.xml"
            - "https://www.cbsnews.com/latest/rss/main"
            - "https://abcnews.go.com/abcnews/topstories"
            - "https://thehill.com/news/feed/"
          max_items: 8
          max_per_feed: 3
          lookback_days: 1

  - name: "Immigration & Visas"
    order: 3
    enabled: true
    length_budget_words: 250
    max_stories: 6
    prompt: prompts/immigration.md
    curate_prompt: prompts/curate_immigration.md
    interests: ["H-1B", "O-1", "visa", "USCIS", "immigration", "green card",
                "international students", "OPT", "STEM"]
    sources:
      # Dedicated immigration feeds (every item is on-topic, so no keyword filter). The Guardian's
      # per-topic RSS carries good daily volume; Immigration Impact adds advocacy/legal angles.
      # Reliable from Cloud Run — these are the publishers' own feeds, unlike Google News (503).
      - type: rss
        params:
          feeds:
            - "https://www.theguardian.com/us-news/usimmigration/rss"
            - "https://immigrationimpact.com/feed/"
          max_items: 6
          max_per_feed: 4
          lookback_days: 3
      # Broad politics/workforce feeds, kept only where an item is clearly immigration-related.
      # Plain RSS has no keyword *search*, so this filter does it. Specific terms only — avoid
      # short ones like "ice" (matches "police"/"service") or "opt" (matches "option").
      - type: rss
        params:
          feeds:
            - "https://thehill.com/news/feed/"
            - "https://rss.politico.com/politics-news.xml"
            - "https://www.govexec.com/rss/workforce/"
          keywords: ["visa", "uscis", "h-1b", "h1b", "immigration", "immigrant",
                     "green card", "deportation", "asylum seeker", "daca",
                     "international student", "naturalization", "migrant",
                     "customs enforcement", "work permit"]
          max_items: 4
          max_per_feed: 2
          lookback_days: 3

  - name: "Markets"
    order: 4
    enabled: true
    length_budget_words: 150
    max_stories: 4
    prompt: prompts/stocks.md
    curate_prompt: prompts/curate_stocks.md
    interests: []
    sources:
      - type: stocks
        params:
          indices: ["^GSPC", "^IXIC", "^DJI"]
          watchlist: ["NVDA", "GOOGL", "MSFT", "AAPL", "AMZN"]
